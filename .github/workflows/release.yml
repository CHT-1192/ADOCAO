name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            git

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Package data
        shell: pwsh
        run: |
          Compress-Archive -Path hitsounds,shaders -DestinationPath build/ADOCAO-data.zip

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ADOCAO.exe
            build/ADOCAO-data.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwayland-dev libxkbcommon-dev libgl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADOCAO_PORTABLE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package data
        run: |
          cd build && zip -r ADOCAO-data.zip ../hitsounds ../shaders

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ADOCAO
            build/ADOCAO-data.zip
